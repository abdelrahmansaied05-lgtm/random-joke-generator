<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد النكات العشوائية - Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .joke-container {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-left: 5px solid #667eea;
        }

        .joke-text {
            font-size: 18px;
            color: #333;
            line-height: 1.6;
            text-align: center;
            font-weight: 500;
        }

        .joke-type {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            grid-column: 1 / -1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-share {
            background: #1DA1F2;
            color: white;
        }

        .btn-share:hover {
            background: #1a91da;
        }

        .btn-copy {
            background: #2ecc71;
            color: white;
        }

        .btn-copy:hover {
            background: #27ae60;
        }

        .category-filter {
            margin-bottom: 25px;
        }

        .category-filter label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
        }

        .category-select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            background: white;
            color: #333;
            transition: border-color 0.3s ease;
        }

        .category-select:hover {
            border-color: #667eea;
        }

        .category-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .stat-item {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .history {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .history h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 16px;
        }

        .history-item {
            background: #f8f9fa;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 14px;
            color: #555;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-delete {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .history-delete:hover {
            background: #ee5a52;
        }

        .error {
            background: #ffe6e6;
            color: #c92a2a;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .success {
            background: #d3f9d8;
            color: #2b8a3e;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }

        .joke-counter {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            .header h1 {
                font-size: 24px;
            }

            .buttons {
                grid-template-columns: 1fr;
            }

            .btn-primary {
                grid-column: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>😂 مولد النكات</h1>
            <p>Random Joke Generator</p>
        </div>

        <div class="error" id="errorMsg"></div>
        <div class="success" id="successMsg"></div>

        <div class="category-filter">
            <label for="category">اختر نوع النكتة:</label>
            <select id="category" class="category-select">
                <option value="random">عشوائي</option>
                <option value="general">عام</option>
                <option value="knock-knock">Knock Knock</option>
                <option value="programming">برمجة</option>
                <option value="misc">متنوع</option>
            </select>
        </div>

        <div class="joke-container">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>جاري تحميل النكتة...</p>
            </div>
            <div id="jokeContent" style="display: none;">
                <div class="joke-type" id="jokeType"></div>
                <div class="joke-text" id="jokeText"></div>
            </div>
        </div>

        <div class="buttons">
            <button class="btn btn-primary" id="generateBtn">احصل على نكتة جديدة</button>
            <button class="btn btn-secondary" id="shareBtn">مشاركة</button>
            <button class="btn btn-copy" id="copyBtn">نسخ</button>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="jokeCount">0</div>
                <div class="stat-label">نكات تم تحميلها</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="categoryCount">0</div>
                <div class="stat-label">أنواع متاحة</div>
            </div>
        </div>

        <div class="history">
            <h3>📝 آخر النكات</h3>
            <div id="historyList"></div>
            <button class="btn btn-secondary" id="clearHistoryBtn" style="width: 100%; margin-top: 10px;">مسح السجل</button>
        </div>

        <div class="joke-counter">
            النسخة 1.0 | تم الإنشاء بـ ❤️
        </div>
    </div>

    <script>
        // API Configuration
        const API_CONFIG = {
            jokes: 'https://official-joke-api.appspot.com/random_joke',
            categories: 'https://official-joke-api.appspot.com/types',
            categoryJoke: 'https://official-joke-api.appspot.com/jokes/{type}/random'
        };

        // State
        let currentJoke = null;
        let jokeHistory = [];
        let jokeCounter = 0;
        let availableCategories = [];

        // DOM Elements
        const generateBtn = document.getElementById('generateBtn');
        const shareBtn = document.getElementById('shareBtn');
        const copyBtn = document.getElementById('copyBtn');
        const categorySelect = document.getElementById('category');
        const jokeContainer = document.getElementById('jokeContent');
        const loading = document.getElementById('loading');
        const jokeText = document.getElementById('jokeText');
        const jokeType = document.getElementById('jokeType');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const jokeCountDisplay = document.getElementById('jokeCount');
        const categoryCountDisplay = document.getElementById('categoryCount');
        const historyList = document.getElementById('historyList');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');

        // Load data from localStorage
        function loadFromStorage() {
            const stored = localStorage.getItem('jokeAppData');
            if (stored) {
                const data = JSON.parse(stored);
                jokeHistory = data.history || [];
                jokeCounter = data.counter || 0;
                updateStats();
                renderHistory();
            }
        }

        // Save data to localStorage
        function saveToStorage() {
            const data = {
                history: jokeHistory,
                counter: jokeCounter
            };
            localStorage.setItem('jokeAppData', JSON.stringify(data));
        }

        // Fetch categories
        async function loadCategories() {
            try {
                const response = await fetch(API_CONFIG.categories);
                if (!response.ok) throw new Error('Failed to load categories');
                availableCategories = await response.json();
                categoryCountDisplay.textContent = availableCategories.length;
            } catch (error) {
                console.error('Error loading categories:', error);
                showError('فشل تحميل الأنواع المتاحة');
            }
        }

        // Fetch joke
        async function getJoke() {
            const selectedCategory = categorySelect.value;
            
            try {
                loading.style.display = 'block';
                jokeContainer.style.display = 'none';
                errorMsg.style.display = 'none';

                let url = API_CONFIG.jokes;
                if (selectedCategory !== 'random') {
                    url = API_CONFIG.categoryJoke.replace('{type}', selectedCategory);
                }

                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch joke');
                
                currentJoke = await response.json();
                
                // Format joke
                let formattedJoke = '';
                if (currentJoke.setup && currentJoke.delivery) {
                    formattedJoke = `${currentJoke.setup}\n\n${currentJoke.delivery}`;
                } else {
                    formattedJoke = currentJoke.joke || 'No joke available';
                }

                currentJoke.formatted = formattedJoke;

                // Update UI
                jokeText.textContent = formattedJoke;
                jokeType.textContent = currentJoke.type || 'عام';

                // Update counter and history
                jokeCounter++;
                jokeHistory.unshift({
                    text: formattedJoke,
                    type: currentJoke.type,
                    timestamp: new Date().toLocaleString('ar-EG')
                });

                // Keep only last 20 jokes
                if (jokeHistory.length > 20) {
                    jokeHistory.pop();
                }

                saveToStorage();
                updateStats();
                renderHistory();

                // Show joke
                loading.style.display = 'none';
                jokeContainer.style.display = 'block';

            } catch (error) {
                console.error('Error fetching joke:', error);
                loading.style.display = 'none';
                showError('حدث خطأ في تحميل النكتة. تأكد من الاتصال بالإنترنت!');
            }
        }

        // Share joke
        function shareJoke() {
            if (!currentJoke) {
                showError('لا توجد نكتة لمشاركتها');
                return;
            }

            const text = `😂 ${currentJoke.formatted}\n\n#مولد_النكات`;
            
            if (navigator.share) {
                navigator.share({
                    title: 'نكتة مضحكة',
                    text: text
                }).catch(err => console.log('Error sharing:', err));
            } else {
                // Fallback: Copy to clipboard and show message
                navigator.clipboard.writeText(text).then(() => {
                    showSuccess('تم نسخ النكتة للمشاركة!');
                });
            }
        }

        // Copy joke
        function copyJoke() {
            if (!currentJoke) {
                showError('لا توجد نكتة لنسخها');
                return;
            }

            navigator.clipboard.writeText(currentJoke.formatted).then(() => {
                showSuccess('تم نسخ النكتة بنجاح! ✓');
            }).catch(err => {
                console.error('Error copying:', err);
                showError('فشل النسخ');
            });
        }

        // Show error message
        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
            setTimeout(() => {
                errorMsg.style.display = 'none';
            }, 4000);
        }

        // Show success message
        function showSuccess(message) {
            successMsg.textContent = message;
            successMsg.style.display = 'block';
            setTimeout(() => {
                successMsg.style.display = 'none';
            }, 2000);
        }

        // Update statistics
        function updateStats() {
            jokeCountDisplay.textContent = jokeCounter;
        }

        // Render history
        function renderHistory() {
            historyList.innerHTML = '';
            
            if (jokeHistory.length === 0) {
                historyList.innerHTML = '<p style="color: #999; text-align: center;">لا توجد نكات في السجل بعد</p>';
                return;
            }

            jokeHistory.slice(0, 5).forEach((joke, index) => {
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `
                    <div>
                        <div style="color: #667eea; font-weight: 600; margin-bottom: 5px;">${joke.text.substring(0, 40)}...</div>
                        <div style="font-size: 12px; color: #999;">${joke.timestamp}</div>
                    </div>
                    <button class="history-delete" onclick="deleteHistoryItem(${index})">حذف</button>
                `;
                historyList.appendChild(item);
            });
        }

        // Delete history item
        window.deleteHistoryItem = function(index) {
            jokeHistory.splice(index, 1);
            saveToStorage();
            renderHistory();
            showSuccess('تم حذف النكتة من السجل');
        };

        // Clear history
        function clearHistory() {
            if (confirm('هل تريد مسح جميع السجلات؟')) {
                jokeHistory = [];
                saveToStorage();
                renderHistory();
                showSuccess('تم مسح السجل بنجاح');
            }
        }

        // Event listeners
        generateBtn.addEventListener('click', getJoke);
        shareBtn.addEventListener('click', shareJoke);
        copyBtn.addEventListener('click', copyJoke);
        clearHistoryBtn.addEventListener('click', clearHistory);

        // Keyboard shortcut
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                getJoke();
            }
        });

        // Initialize
        loadFromStorage();
        loadCategories();
        getJoke(); // Load initial joke
    </script>
</body>
</html>
